apiVersion: batch/v1
kind: Job
metadata:
  name: eunwoo-yolo-hand-v7
  namespace: p-test2
  labels:
    mlx.navercorp.com/zone: private-h200-realitylab-0
    management.mlx.navercorp.com/project: test2
    management.mlx.navercorp.com/workspace: realitylab
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels:
        mlx.navercorp.com/zone: private-h200-realitylab-0
        management.mlx.navercorp.com/project: test2
        management.mlx.navercorp.com/workspace: realitylab
      annotations:
        mlx.navercorp.com/zone: private-h200-realitylab-0
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      nodeSelector:
        mlx.navercorp.com/zone: private-h200-realitylab-0
      containers:
      - name: yolo-hand
        image: mlx-public.kr.ncr.ntruss.com/mlx/notebook/kubeflow-jupyter:2.7.0
        workingDir: /workspace/Projects/cup_stack/vision-YOLO/data_generator
        command: ["/workspace/envs/yolo/bin/python", "-u", "train_hand.py",
                  # DDP needs a FIXED batch that's a multiple of GPU count (4).
                  # 128 = 32/GPU ≈ 88GB/144GB (61%) — better H200 utilization +
                  # fewer DDP syncs/epoch → faster wall-clock (사용자: hand 가속).
                  "--sizes", "s", "--batch", "128"]
        env:
        # NO cache=ram: with 4 DDP ranks it loads 4 copies of the dataset into
        # host RAM (≈80GB) + batch-128 prefetch → container OOMKilled. PVC read
        # is fast (~186MB/s), so disk loading costs little. (사용자: hand 가속)
        - { name: YOLO_DEVICE, value: "0,1,2,3" }       # 4×H200 DDP
        resources:
          requests: { cpu: "32", memory: 160Gi }
          limits:   { cpu: "48", memory: 384Gi, nvidia.com/gpu: "4" }
        volumeMounts:
        - { name: eunwoo-workspace-1, mountPath: /workspace }
        - { name: dshm, mountPath: /dev/shm }
      volumes:
      - name: eunwoo-workspace-1
        persistentVolumeClaim: { claimName: eunwoo-workspace-1 }
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: 128Gi }  # DDP shared memory
